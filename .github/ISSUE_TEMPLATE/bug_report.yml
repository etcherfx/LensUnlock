name: Bug report
description: Report unexpected behavior with reproducible details.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please search existing issues and remove secrets or personal information from any logs or screenshots.
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include the camera, zoom, stabilization or frame rate you expected and the one you saw.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Which app used the camera, which settings you chose for it, and whether the app is in the module's scope.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Module version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Device and framework
      description: Device model, Android version, and the Xposed framework with its version.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Optional. Do not include credentials, tokens, keys or personal data.
